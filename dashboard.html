<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA</title>
<style>
  :root {
    --page:    #f9f9f7;  --surface: #fcfcfb;
    --ink:     #0b0b0b;  --ink-2:   #52514e;  --ink-3: #898781;
    --line:    #e1e0d9;
    --accent:  #2a78d6;
    --good:    #0ca30c;  --warning: #fab219;
    --serious: #ec835a;  --critical:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:  #0d0d0d;  --surface: #1a1a19;
      --ink:   #ffffff;  --ink-2:   #c3c2b7;  --ink-3: #898781;
      --line:  #2c2c2a;
      --accent:#3987e5;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px; max-width: 1080px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 20px; letter-spacing: .04em; }
  h2 { font-size: 13px; color: var(--ink-2); text-transform: uppercase;
       letter-spacing: .08em; margin: 22px 0 8px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); }
  .pill .dot { margin-right: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         vertical-align: baseline; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line);
          border-radius: 8px; padding: 12px 14px; }
  .tile .label { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
                 letter-spacing: .07em; }
  .tile .value { font-size: 24px; font-weight: 600; margin-top: 2px;
                 font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 11px; color: var(--ink-2); }
  .meter { height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; }
  .meter > div { height: 100%; background: var(--accent); border-radius: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
          display: flex; gap: 12px; align-items: center; }
  .card .goal { flex: 1; min-width: 0; }
  .card .goal .id { font-size: 11px; color: var(--ink-3); font-family: ui-monospace, monospace; }
  button { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 6px;
           border: 1px solid var(--line); background: var(--surface);
           color: var(--ink); cursor: pointer; }
  button.approve { border-color: var(--good); }
  button.reject  { border-color: var(--critical); }
  button:hover { filter: brightness(0.95); }
  table { width: 100%; border-collapse: collapse; background: var(--surface);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--line);
           vertical-align: top; }
  th { font-size: 11px; color: var(--ink-3); text-transform: uppercase;
       letter-spacing: .07em; border-top: none; }
  td.mono { font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
  td.goal { color: var(--ink-2); max-width: 420px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; white-space: nowrap; }
  .badge .dot { margin-right: 5px; }
  #feed { background: var(--surface); border: 1px solid var(--line);
          border-radius: 8px; max-height: 380px; overflow-y: auto;
          font-family: ui-monospace, monospace; font-size: 12px; }
  .ev { display: flex; gap: 10px; padding: 5px 12px; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: none; }
  .ev .t { color: var(--ink-3); white-space: nowrap; }
  .ev .who { color: var(--accent); white-space: nowrap; min-width: 70px; }
  .ev .what { color: var(--ink); white-space: nowrap; }
  .ev .why { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; flex: 1; }
  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex;
            flex-direction: column; gap: 8px; z-index: 10; }
  .toast { background: var(--surface); border: 1px solid var(--line);
           border-left: 3px solid var(--accent); border-radius: 6px;
           padding: 10px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15);
           max-width: 340px; font-size: 13px; }
  .empty { color: var(--ink-3); padding: 10px 2px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>NOVA</h1>
    <span class="pill" id="loop-pill"><span class="dot" style="background:var(--ink-3)"></span>connecting…</span>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2>Awaiting your approval</h2>
  <div id="approvals"><div class="empty">Nothing waiting.</div></div>

  <h2>Tasks</h2>
  <div id="tasks"></div>

  <h2>Activity</h2>
  <div id="feed"></div>

  <div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { lastLogId: 0, statuses: {}, first: true };

const STATUS = {  // color + label, never color alone
  done:           ["var(--good)",     "done"],
  needs_approval: ["var(--warning)",  "needs approval"],
  failed:         ["var(--critical)", "failed"],
  in_progress:    ["var(--accent)",   "in progress"],
  pending:        ["var(--ink-3)",    "pending"],
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // untrusted content stays text
  return n;
}
function badge(status) {
  const [color, label] = STATUS[status] || ["var(--ink-3)", status];
  const b = el("span", "badge");
  const d = el("span", "dot"); d.style.background = color;
  b.append(d, label);
  return b;
}
function toast(text) {
  const t = el("div", "toast", text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), 8000);
}
async function getJSON(url) { const r = await fetch(url); return r.json(); }

function renderTiles(overview) {
  const hb = overview.heartbeat, counts = overview.task_counts || {};
  const tiles = $("tiles"); tiles.replaceChildren();
  const stat = (label, value, sub) => {
    const t = el("div", "tile");
    t.append(el("div", "label", label), el("div", "value", String(value)));
    if (sub) t.append(el("div", "sub", sub));
    tiles.append(t); return t;
  };
  stat("Awaiting approval", counts.needs_approval || 0);
  stat("Running", (counts.in_progress || 0) + (counts.pending || 0));
  stat("Done", counts.done || 0);
  stat("Failed", counts.failed || 0);
  for (const [name, used, limit] of [
      ["Gemini today", hb?.gemini_used, hb?.gemini_limit],
      ["Groq today", hb?.groq_used, hb?.groq_limit]]) {
    const t = stat(name, limit ? `${used} / ${limit}` : "off",
                   limit ? "" : "no key — local only");
    if (limit) {
      const m = el("div", "meter"), fill = el("div");
      fill.style.width = Math.min(100, 100 * used / limit) + "%";
      m.append(fill); t.append(m);
    }
  }
  const pill = $("loop-pill"); pill.replaceChildren();
  const dot = el("span", "dot");
  if (hb) {
    const age = (Date.now() - Date.parse(hb.updated_at)) / 1000;
    const alive = age < Math.max(3 * hb.interval_seconds, 10);
    dot.style.background = alive ? "var(--good)" : "var(--critical)";
    pill.append(dot, alive ? `loop alive — tick ${hb.tick}`
                           : `loop offline — last seen ${Math.round(age)}s ago`);
  } else {
    dot.style.background = "var(--ink-3)";
    pill.append(dot, "loop has never run");
  }
}

async function decide(taskId, approved) {
  if (!approved && !confirm(`Reject ${taskId}? The task will fail terminally.`)) return;
  const r = await fetch("/api/decision", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({task_id: taskId, approved}),
  });
  const out = await r.json();
  toast(r.ok ? `${approved ? "Approval" : "Rejection"} recorded for ${taskId} — ` +
               `the loop applies it on its next tick.` : `Error: ${out.error}`);
  poll();
}

function renderTasks(tasks) {
  const gate = tasks.filter(t => t.status === "needs_approval");
  const wrap = $("approvals"); wrap.replaceChildren();
  if (!gate.length) wrap.append(el("div", "empty", "Nothing waiting."));
  for (const t of gate) {
    const card = el("div", "card");
    const g = el("div", "goal");
    g.append(el("div", "id", t.task_id), el("div", "", t.goal));
    if (t.pending_decision !== null) {
      g.append(el("div", "id",
        `decision recorded (${t.pending_decision ? "approve" : "reject"}) — waiting for the loop`));
    }
    const yes = el("button", "approve", "Approve");
    yes.onclick = () => decide(t.task_id, true);
    const no = el("button", "reject", "Reject");
    no.onclick = () => decide(t.task_id, false);
    card.append(g, yes, no);
    wrap.append(card);
  }

  const table = el("table");
  const head = el("tr");
  for (const h of ["Task", "Status", "Source", "Goal", "Updated"]) head.append(el("th", "", h));
  table.append(head);
  for (const t of tasks) {
    const tr = el("tr");
    tr.append(el("td", "mono", t.task_id));
    const td = el("td"); td.append(badge(t.status)); tr.append(td);
    tr.append(el("td", "", t.source + (t.privacy_sensitive ? " (local-only)" : "")));
    const goal = el("td", "goal", t.goal); goal.title = t.goal; tr.append(goal);
    tr.append(el("td", "mono", (t.updated_at || "").replace("T", " ").slice(0, 19)));
    table.append(tr);

    const prev = state.statuses[t.task_id];
    if (!state.first && prev && prev !== t.status) {
      if (t.status === "needs_approval") toast(`⚠ ${t.task_id} needs your approval`);
      if (t.status === "done") toast(`✓ ${t.task_id} finished`);
      if (t.status === "failed") toast(`✗ ${t.task_id} failed`);
    }
    state.statuses[t.task_id] = t.status;
  }
  $("tasks").replaceChildren(tasks.length ? table : el("div", "empty", "No tasks yet."));
}

function renderLog(entries) {
  const feed = $("feed");
  for (const e of entries) {
    const row = el("div", "ev");
    row.append(
      el("span", "t", (e.timestamp || "").slice(11, 19)),
      el("span", "who", e.actor),
      el("span", "what", e.action_type),
      el("span", "why", e.reason || ""));
    row.title = e.detail || "";
    feed.prepend(row);                       // newest on top
    state.lastLogId = Math.max(state.lastLogId, e.id);
  }
  while (feed.childElementCount > 200) feed.lastElementChild.remove();
}

async function poll() {
  try {
    const [overview, tasks, log] = await Promise.all([
      getJSON("/api/overview"),
      getJSON("/api/tasks?limit=50"),
      getJSON(`/api/log?after_id=${state.lastLogId}&limit=100`),
    ]);
    renderTiles(overview);
    renderTasks(tasks);
    renderLog(log);
    state.first = false;
  } catch (err) {
    const pill = $("loop-pill"); pill.replaceChildren();
    const dot = el("span", "dot"); dot.style.background = "var(--critical)";
    pill.append(dot, "dashboard server unreachable");
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
